<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png">
<title>Track an order — Git Pizza MxDev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="_shared/proto.css">
</head>
<body data-screen="SCR-10" data-nav="track">
<main id="main"><div class="page"><div style="max-width:620px;margin:24px auto" id="box"></div></div></main>
<script src="_shared/proto.js"></script>
<script>
(function () {
  var st = GP.state(), E = GP.esc;
  GP.registerStates([['empty', 'Empty form'], ['not-found', 'Not found'], ['found', 'Found → tracking']]);
  var mode = GP.currentState();
  var guestOrders = GP.allOrders();
  var example = guestOrders[0] ? ['MX-' + guestOrders[0].no, guestOrders[0].contact.email] : ['MX-1018', 'jordan.lee@example.com'];
  var val = { no: mode === 'not-found' ? 'MX-1999' : mode === 'found' ? example[0] : '', email: mode === 'not-found' ? 'taylor.brooks@example.com' : mode === 'found' ? example[1] : '' }, err = {}, notFound = mode === 'not-found';
  var box = document.getElementById('box');
  function render() {
    box.innerHTML = '<div class="t-micro c-muted">./track.log</div><h1 class="t-h1 c-primary mt-8">git log --grep</h1><p class="t-body-long">Find your order with its number and the email you used at checkout. You will find both in the confirmation.</p>' +
      (notFound ? '<div class="notice error" role="alert"><span class="ms" aria-hidden="true">search_off</span><div><strong>No order found.</strong> No order matches ' + E(val.no.toUpperCase()) + ' and this email. Check both values and try again.</div></div>' : '') +
      '<form class="panel panel-pad stack mt-16" id="f" novalidate>' +
      '<div class="field' + (err.no ? ' invalid' : '') + '"><label for="no">ORDER_NUMBER</label><div class="prompt-wrap"><input class="input prompt" id="no" value="' + E(val.no) + '" placeholder="MX-1064" aria-required="true"' + (err.no ? ' aria-invalid="true" aria-describedby="e-no"' : '') + '></div>' + (err.no ? '<div class="field-error" id="e-no">' + err.no + '</div>' : '<div class="hint">Format MX- followed by digits</div>') + '</div>' +
      '<div class="field' + (err.email ? ' invalid' : '') + '"><label for="em">CONTACT_EMAIL</label><div class="prompt-wrap"><input class="input prompt" id="em" type="email" value="' + E(val.email) + '" placeholder="you@example.com" aria-required="true"' + (err.email ? ' aria-invalid="true" aria-describedby="e-em"' : '') + '></div>' + (err.email ? '<div class="field-error" id="e-em">' + err.email + '</div>' : '') + '</div>' +
      '<button class="btn btn-primary btn-lg" aria-label="Find order"><span class="ms" aria-hidden="true">search</span>git log --grep</button></form>' +
      '<p class="t-small c-muted mt-16">Prototype example: ' + E(example[0]) + ' / ' + E(example[1]) + '. Orders of the demo seed (MX-1001 … MX-1018, MX-1040) are found with jordan.lee@example.com.</p>';
  }
  box.addEventListener('submit', function (e) {
    e.preventDefault(); val.no = document.getElementById('no').value.trim(); val.email = document.getElementById('em').value.trim(); err = {}; notFound = false;
    if (!val.no) err.no = 'ORDER_NUMBER is required'; else if (!/^MX-?\d+$/i.test(val.no)) err.no = 'ORDER_NUMBER must look like MX-1048.';
    if (!val.email) err.email = 'CONTACT_EMAIL is required'; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val.email)) err.email = 'CONTACT_EMAIL is not a valid email address';
    if (!err.no && !err.email) {
      var o = GP.findOrder(val.no);
      if (o && o.contact && o.contact.email.toLowerCase() === val.email.toLowerCase()) { location.href = 'SCR-09-order-tracking.html?id=MX-' + o.no; return; }
      notFound = true;
    }
    render();
  });
  render();
})();
</script>
</body>
</html>
