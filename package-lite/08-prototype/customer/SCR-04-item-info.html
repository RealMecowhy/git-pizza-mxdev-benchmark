<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png">
<title>Item info — Git Pizza MxDev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="_shared/proto.css">
<style>
  .info-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin-top: 16px; }
  .facts dt { color: var(--text-muted); } .facts dd { margin: 0; }
  .backdrop-hint { opacity: 0.35; pointer-events: none; }
  @media (max-width: 767px) { .info-grid { grid-template-columns: 1fr; } .info-grid .img-frame { max-width: 220px; } }
</style>
</head>
<body data-screen="SCR-04" data-nav="menu">
<main id="main"><div class="page backdrop-hint" aria-hidden="true"><h1 class="t-display">Build Your Instance</h1><p class="c-muted">./menu.ts</p></div></main>
<script src="_shared/proto.js"></script>
<script>
(function () {
  var st = GP.state(), E = GP.esc;
  GP.registerStates([['default', 'Default (side)'], ['drink', 'Drink'], ['pizza', 'Pizza allergen info'], ['sold-out', 'Sold out (Tiramisu Stack)']]);
  var mode = GP.currentState();
  var code = (GP.param('state') && { drink: 'DR-01', pizza: 'PZ-04', 'sold-out': 'DS-01' }[mode]) || GP.param('p') || 'SD-01';
  if (!GP.BY_CODE[code]) { location.replace(GP.PAGES.notFound + '?what=' + encodeURIComponent('/menu/' + code)); return; }
  var p = GP.BY_CODE[code], pz = p.kind === 'PIZZA', ok = GP.isOrderable(p), qty = 1;
  var back = 'SCR-02-menu.html?cat=' + p.cat;
  var line = pz ? GP.defaultLine(code) : { p: code, size: 'REGULAR', qty: 1 };
  var all = GP.lineAllergens(line), diet = GP.lineDiet(line);
  var ext = { PIZZA: '.ts', SIDE: '.yml', DRINK: '.env', DESSERT: '.md' }[p.kind];
  function kcalRange() { var v = Object.keys(p.kcal).map(function (k) { return p.kcal[k]; }); return Math.min.apply(null, v).toLocaleString('en-US') + '–' + Math.max.apply(null, v).toLocaleString('en-US'); }

  var scrim = GP.h('<div class="scrim"></div>');
  var m = GP.h('<div class="modal sheet" role="dialog" aria-modal="true" aria-labelledby="mi-t"></div>');
  function render() {
    var facts = '<dt>Serving</dt><dd>' + (pz ? GP.SIZES[GP.defaultSize(p)].label + ' · ' + (p.slices || 8) + (p.slices === 1 ? ' piece' : ' slices') : E(p.serving)) + '</dd>' +
      '<dt>Price</dt><dd class="price">' + GP.money(GP.cardPrice(p)) + (pz ? ' (Small ' + (p.prices.SMALL ? GP.money(p.prices.SMALL) : '—') + ' · Large ' + (p.prices.LARGE ? GP.money(p.prices.LARGE) : '—') + ')' : '') + '</dd>' +
      '<dt>Calories</dt><dd>' + (pz ? kcalRange() + ' kcal (whole pizza, by size)' : p.kcal + ' kcal') + '</dd>' +
      (p.caffeine ? '<dt>Caffeine</dt><dd>' + p.caffeine + '</dd>' : '') +
      '<dt>Diet</dt><dd>' + (diet.vegan ? '&lt;Vegan /&gt;' : diet.veg ? '&lt;Vegetarian /&gt;' : 'Not vegetarian') + '</dd>' +
      '<dt>Spice</dt><dd>' + { NONE: 'Not spicy (0)', MILD: 'Mild (1)', MEDIUM: 'Medium (2)', HOT: 'Hot (3)' }[p.spice] + '</dd>';
    m.innerHTML = '<div class="modal-head"><span class="ms c-primary" aria-hidden="true">info</span><div style="flex:1;min-width:0"><div class="t-micro c-muted">module.info</div><h2 class="t-h3" id="mi-t">' + p.key + ext + '</h2></div><a class="icon-btn" href="' + back + '" aria-label="Close item details"><span class="ms">close</span></a></div>' +
      '<div class="modal-body"><div class="info-grid"><div>' + GP.imgHtml(p) + '</div><div>' +
      (ok ? '' : '<div class="notice error" style="margin-bottom:12px"><span class="ms" aria-hidden="true">block</span><div><strong>404: OUT_OF_STOCK.</strong> Sold out today.</div></div>') +
      '<h3 class="t-h2 c-primary">' + E(p.name) + '</h3><div class="c-secondary t-small">' + E(p.real) + '</div><div class="row mt-8" style="gap:6px">' + GP.badgesHtml(p) + '</div>' +
      '<p class="t-body-long" style="margin:12px 0 0">' + E(p.desc) + '</p><dl class="facts">' + facts + '</dl>' +
      (pz ? '<pre class="code mt-8" aria-label="Default recipe">' + GP.codeBlock(p) + '</pre>' : '') + '</div></div>' +
      '<div class="panel panel-pad mt-16"><h3 class="section-label"><span class="ms" aria-hidden="true">health_and_safety</span>Allergens' + (pz ? ' (default configuration)' : '') + '</h3>' +
      '<div class="row" style="gap:6px">' + (all.length ? all.map(function (a) { return '<span class="chip tag-spice">' + GP.ALLERGENS[a] + '</span>'; }).join('') : '<span class="chip tag-badge">No major allergens</span>') + '</div>' +
      (pz ? '<p class="t-micro c-muted mt-8">Default build. Changes in the configurator update allergens.</p>' : '') +
      '<p class="t-small c-muted mt-8" style="margin-bottom:0">' + E(GP.ALLERGEN_NOTICE) + '</p></div></div>' +
      '<div class="modal-foot">' + (pz ? '<a class="btn btn-ghost" href="SCR-03-pizza-configurator.html?p=' + p.code + '"><span class="ms md" aria-hidden="true">tune</span>Configure this module →</a>' : '') +
      (pz ? '' : '<div class="stepper" role="group" aria-label="Quantity"><span class="lbl">instances:</span><button data-q="-1" aria-label="Decrease quantity"' + (qty <= 1 || !ok ? ' disabled' : '') + '>−</button><span class="val" aria-live="polite">' + qty + '</span><button data-q="1" aria-label="Increase quantity"' + (qty >= 10 || !ok ? ' disabled' : '') + '>+</button></div>') +
      '<button class="btn btn-primary" id="add"' + (ok ? '' : ' disabled') + ' aria-label="Add to cart"><span class="ms md" aria-hidden="true">add_box</span>' + (ok ? '+ import' : 'SOLD_OUT') + '</button></div>';
  }
  m.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.q) { qty = Math.max(1, Math.min(10, qty + parseInt(b.dataset.q, 10))); render(); return; }
    if (b.id === 'add') { line.qty = qty; GP.addLine(line); location.href = back + '&added=' + encodeURIComponent(p.code); }
  });
  scrim.addEventListener('click', function () { location.href = back; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') location.href = back; });
  render();
  document.body.appendChild(scrim); document.body.appendChild(m);
})();
</script>
</body>
</html>
