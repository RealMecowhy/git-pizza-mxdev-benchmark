<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../../assets/brand/apple-touch-icon.png">
<title>Menu — Git Pizza MxDev</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="_shared/proto.css">
<style>
  .menu-wrap { display: grid; grid-template-columns: minmax(0, 1fr) var(--sidepanel-w); min-height: 100%; }
  .menu-main { padding: 0 0 48px; min-width: 0; }
  .menu-main .inner { padding: 32px var(--margin) 0; }
  .debugger { border-left: 1px solid var(--border-strong); background: var(--surface-lowest); position: sticky; top: calc(var(--header-h) + var(--banner-h)); height: calc(100vh - var(--header-h) - var(--banner-h)); display: flex; flex-direction: column; }
  .debugger .dbg-head { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface-container); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .debugger .dbg-body { flex: 1; overflow-y: auto; padding: 16px 18px; font-size: 12px; line-height: 1.6; }
  .debugger .dbg-foot { padding: 16px 18px; border-top: 1px solid var(--border); background: var(--surface-low); display: grid; gap: 10px; }
  .search-row { display: flex; gap: 12px; align-items: center; margin: 20px 0 8px; flex-wrap: wrap; }
  .search-row .grep { display: flex; width: auto; flex: 1; min-width: 220px; max-width: 520px; min-height: 44px; }
  .phone-cartbar { display: none; }
  @media (max-width: 1199px) { .menu-wrap { grid-template-columns: 1fr; } .debugger { display: none; } }
  @media (max-width: 767px) {
    .phone-cartbar { display: flex; position: fixed; left: 8px; right: 8px; bottom: calc(var(--bottomnav-h) + 8px); z-index: 95; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-high); border: 1px solid var(--border-accent); border-radius: var(--r-md); box-shadow: var(--shadow-top); }
    .menu-main { padding-bottom: 96px; } .menu-main .inner { padding-top: 20px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body data-screen="SCR-02" data-nav="menu">
<main id="main">
  <div class="menu-wrap">
    <div class="menu-main">
      <div class="file-tabs" role="tablist" aria-label="Menu categories" id="tabs"></div>
      <div class="inner">
        <h1 class="t-display">Build Your Instance</h1>
        <p class="t-small mt-8" style="margin-bottom:0"><span class="k">const</span> menu <span class="p">=</span> <span class="f">fetchInventory</span><span class="p">(</span><span class="s">'production'</span><span class="p">);</span> <span class="cm">// prices exclude 8.625 % sales tax</span></p>
        <div class="search-row">
          <form class="grep" role="search" id="search-form"><span class="ms md c-muted" aria-hidden="true">search</span><input id="q" aria-label="Search the menu by name, dish or ingredient" placeholder="grep -i --scope=menu '...'"></form>
          <span class="t-small c-muted" id="result-count" aria-live="polite"></span>
        </div>
        <div class="cards mt-16" id="cards" aria-live="polite"></div>
        <div class="notice info mt-40" id="allergens"><span class="ms" aria-hidden="true">info</span><div><strong>Allergens.</strong> <span id="allergen-notice"></span> Open <span class="c-primary">module.info</span> on any item for its full allergen list.</div></div>
      </div>
    </div>
    <aside class="debugger" aria-label="Terminal Debugger — live cart summary">
      <div class="dbg-head"><span><strong>Terminal Debugger</strong> · session: <span class="c-green">active_order</span></span><span class="ms md c-green" aria-hidden="true">sensors</span></div>
      <div class="dbg-body" id="dbg"></div>
      <div class="dbg-foot" id="dbg-foot"></div>
    </aside>
  </div>
  <div class="phone-cartbar" id="phone-cartbar" hidden></div>
</main>
<script src="_shared/proto.js"></script>
<script>
(function () {
  var st = GP.state();
  GP.registerStates([['results', 'Results'], ['loading', 'Loading'], ['no-results', 'No search results'], ['sold-out', 'Item sold out (Tiramisu Stack)']]);
  var mode = GP.currentState();
  document.getElementById('allergen-notice').textContent = GP.ALLERGEN_NOTICE;

  var cat = (GP.param('cat') || (mode === 'sold-out' ? 'DESSERTS' : 'PIZZAS')).toUpperCase(), query = GP.param('q') || (mode === 'no-results' ? 'anchovies' : '');
  var qi = document.getElementById('q'); qi.value = query;

  function renderTabs() {
    document.getElementById('tabs').innerHTML = GP.CATEGORIES.map(function (c) {
      var n = GP.PRODUCTS.filter(function (p) { return p.cat === c.code; }).length;
      return '<button class="file-tab" role="tab" aria-selected="' + (c.code === cat && !query) + '" data-cat="' + c.code + '" title="' + GP.esc(c.name) + '"><span class="ms sm" aria-hidden="true">' + c.icon + '</span>' + c.file + ' <span class="cnt">' + n + '</span><span class="sr-only"> — ' + GP.esc(c.name) + '</span></button>';
    }).join('');
  }
  function match(p, q) {
    q = q.toLowerCase(); var hay = [p.name, p.real, p.key, p.short].join(' ').toLowerCase();
    if (p.kind === 'PIZZA') p.r.forEach(function (r) { hay += ' ' + GP.INGR[r[0]][0].toLowerCase(); });
    return hay.indexOf(q) >= 0;
  }
  function card(p) {
    var ok = GP.isOrderable(p), pz = p.kind === 'PIZZA';
    var ext = { PIZZA: '.ts', SIDE: '.yml', DRINK: '.env', DESSERT: '.md' }[p.kind];
    return '<article class="pcard' + (ok ? '' : ' sold-out') + '">' +
      '<div class="pcard-head"><span class="ms sm c-orange" aria-hidden="true">' + (pz ? 'data_object' : 'description') + '</span><span class="fname">' + p.key + ext + '</span>' + (p.ver ? '<span class="t-micro c-green">' + p.ver + '</span>' : '') + '</div>' +
      '<div style="position:relative">' + (ok ? '' : '<span class="chip tag-sold sold-ribbon" title="Sold out today">404: OUT_OF_STOCK</span>') + GP.imgHtml(p) + '</div>' +
      '<div class="pcard-body"><div class="pcard-title"><h3 class="t-h3">' + GP.esc(p.name) + '</h3><span class="price">' + GP.money(GP.cardPrice(p)) + (pz ? ' · ' + GP.sizeShort(p) : '') + '</span></div>' +
      '<div class="real">' + GP.esc(p.real) + (pz ? '' : ' · ' + GP.esc(p.serving)) + '</div>' +
      '<pre class="code" aria-label="Ingredients">' + GP.codeBlock(p) + '</pre>' +
      '<div class="row" style="gap:6px">' + GP.badgesHtml(p) + '</div></div>' +
      '<div class="pcard-foot">' +
      (ok ? '<button class="btn btn-primary" data-import="' + p.code + '" aria-label="Add ' + GP.esc(p.name) + (pz ? ', Medium 12",' : '') + ' to cart"><span class="ms md" aria-hidden="true">add_box</span>+ import</button>'
          : '<button class="btn btn-primary" disabled aria-label="' + GP.esc(p.name) + ' is sold out today">SOLD_OUT</button>') +
      (pz ? '<a class="btn btn-ghost" href="SCR-03-pizza-configurator.html?p=' + p.code + '" aria-label="Configure ' + GP.esc(p.name) + '" title="Configure"><span class="ms md">tune</span></a>' : '') +
      '<a class="btn btn-ghost" href="SCR-04-item-info.html?p=' + p.code + '" aria-label="Details, allergens and nutrition of ' + GP.esc(p.name) + '" title="module.info"><span class="ms md">info</span></a>' +
      '</div></article>';
  }
  function render() {
    renderTabs();
    var list = query ? GP.PRODUCTS.filter(function (p) { return match(p, query); }) : GP.PRODUCTS.filter(function (p) { return p.cat === cat; });
    var cards = document.getElementById('cards');
    document.getElementById('result-count').textContent = query ? list.length + ' match' + (list.length === 1 ? '' : 'es') + " for '" + query + "'" : list.length + ' modules in ' + GP.CATEGORIES.filter(function (c) { return c.code === cat; })[0].file;
    if (mode === 'loading') { cards.innerHTML = [1, 2, 3, 4, 5, 6].map(function () { return '<div class="skeleton" style="height:520px" aria-hidden="true"></div>'; }).join('') + '<span class="sr-only">Loading menu…</span>'; return; }
    if (!list.length) {
      cards.innerHTML = '<div class="panel panel-pad" style="grid-column:1/-1;text-align:center"><div style="max-width:320px;margin:0 auto;aspect-ratio:4/3;position:relative">' + GP.placeholder('illustrations/no-results.png', 'search_off') + '</div>' +
        '<h2 class="t-h3 mt-16">grep: no matches for \'' + GP.esc(query) + '\'</h2><p class="t-small c-muted">Try a pizza name, a dish (e.g. "margherita") or an ingredient (e.g. "jalapeños").</p><button class="btn btn-secondary mt-8" id="clear-q">Clear search</button></div>';
      document.getElementById('clear-q').onclick = function () { query = ''; qi.value = ''; render(); };
      return;
    }
    cards.innerHTML = list.map(card).join('');
  }
  function renderDebugger() {
    var lines = st.cart.lines, t = GP.cartTotals(), n = GP.itemCount();
    var dbg;
    if (!lines.length) dbg = '<div class="tag-success">[INFO] Initializing cart module...</div><div class="tag-success">[INFO] Waiting for input...<span class="cursor"></span></div><div class="cm mt-16">// Memory address empty</div>';
    else {
      dbg = '<div class="tag-success">[INFO] ' + n + (n === 1 ? ' dependency' : ' dependencies') + ' installed.</div>';
      dbg += lines.slice(0, 8).map(function (l) { var p = GP.BY_CODE[l.p]; return '<div class="mt-8"><span class="c-green">[OK]</span> ' + l.qty + '× ' + GP.esc(p.name) + (p.kind === 'PIZZA' ? ' (' + GP.esc(GP.SIZES[l.size].label) + ')' : '') + ' <span class="c-green">' + GP.money(GP.unitPrice(l) * l.qty) + '</span></div>'; }).join('');
      if (lines.length > 8) dbg += '<div class="c-muted mt-8">… ' + (lines.length - 8) + ' more</div>';
    }
    document.getElementById('dbg').innerHTML = dbg;
    var live = GP.PRODUCTS.filter(function (p) { return !p.status || p.status === 'PUBLISHED'; }).length;
    document.getElementById('dbg-foot').innerHTML = '<div class="between"><span class="c-secondary">Total Output:</span><span class="price">' + GP.money(t.subtotal - (t.discount || 0)) + '</span></div>' +
      '<a class="btn btn-success btn-block' + (lines.length ? '' : ' is-disabled') + '" ' + (lines.length ? 'href="SCR-06-checkout.html"' : 'aria-disabled="true" title="Your manifest is empty. Import a module first."') + ' aria-label="Go to checkout"><span class="ms md" aria-hidden="true">terminal</span>EXECUTE ORDER</a>' +
      '<a class="btn btn-ghost btn-block mt-8" href="SCR-05-cart.html" aria-label="Open cart">cat MANIFEST.LOCK</a>' +
      '<div class="t-micro c-muted" style="text-align:center">build: mission-kitchen · ' + live + ' modules in production</div>';
    var pb = document.getElementById('phone-cartbar');
    pb.hidden = !lines.length;
    pb.innerHTML = '<span class="ms c-primary" aria-hidden="true">inventory_2</span><div style="flex:1;min-width:0"><div class="t-micro c-secondary">PACKAGE_RESOLVED (' + n + ')</div><div class="price">' + GP.money(t.subtotal) + '</div></div><a class="btn btn-primary" href="SCR-05-cart.html" aria-label="Open cart">deploy &gt;</a>';
  }
  document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; query = ''; qi.value = ''; render(); });
  // BR-MENU-10: at least 2 characters, otherwise no filtering and the hint TXT-MENU-64
  function onSearch() { var v = qi.value.trim(); query = v.length >= 2 ? v : ''; render(); if (v.length === 1) document.getElementById('result-count').textContent = 'Type at least 2 characters to search.'; }
  document.getElementById('search-form').addEventListener('submit', function (e) { e.preventDefault(); onSearch(); });
  qi.addEventListener('input', onSearch);
  document.getElementById('cards').addEventListener('click', function (e) {
    var b = e.target.closest('[data-import]'); if (!b) return;
    var p = GP.BY_CODE[b.dataset.import]; GP.addLine(GP.defaultLine(p.code)); GP.refreshCartCount(); renderDebugger();
    GP.toast(GP.esc(p.name) + (p.kind === 'PIZZA' ? ' (Medium 12")' : '') + ' added to the manifest.', '', 'SCR-05-cart.html', 'View manifest');
  });
  render(); renderDebugger();
  var added = GP.param('added'); if (added && GP.BY_CODE[added]) GP.toast(GP.esc(GP.BY_CODE[added].name) + ' added to the manifest.', '', 'SCR-05-cart.html', 'View manifest');
})();
</script>
</body>
</html>
