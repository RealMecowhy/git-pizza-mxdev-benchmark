<!-- SCR-40 Not found (ERROR 404 // CRUST_NOT_FOUND). Minimal frame: DEMO MODE banner + logo, no navigation shell.
     Layout of Stitch desktop/system-error (obsolete PIZZA_OS branding replaced). Texts: TXT-ERR-01, 02, 08, 12, 13, 16, 17, TXT-NAV-05. -->
<body class="grid-bg" data-screen="SCR-40" data-no-shell>
<noscript>ERROR 404 // CRUST_NOT_FOUND — this prototype page needs JavaScript.</noscript>
<script src="_shared/proto.js"></script>
<script>
(function () {
  var E = GP.esc;
  GP.registerStates([['default', 'Default']]);
  var path = E((GP.param('what') || '/menu/pizzas/pineapple-on-mainframe').slice(0, 60)); /* E-04: requested path, max 60 characters, escaped */
  var trace = [
    '<span class="c-error">[FATAL] Uncaught ReferenceError: \'crust\' is not defined in scope.</span>',
    '<span class="k">at</span> <span class="f">Kitchen.assemble</span>(<span class="s">"' + path + '"</span>) <span class="cm">// kitchen.ts:102:14</span>',
    '<span class="k">at</span> <span class="f">Oven.bake</span>({ temp: <span class="n">850</span>, unit: <span class="s">\'F\'</span> }) <span class="cm">// oven.ts:45:22</span>',
    '<span class="k">at</span> <span class="f">Router.resolve</span>(<span class="s">"' + path + '"</span>) <span class="cm">// router.ts:12:3</span>',
    '<span class="k">at</span> <span class="f">GitPizza.boot</span>() <span class="cm">// main.js:1:1</span>'
  ];
  function uptime() { var now = new Date(), start = new Date(now); start.setHours(4, 0, 0, 0); if (start > now) start.setDate(start.getDate() - 1); var s = Math.floor((now - start) / 1000); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':'); }
  document.body.insertAdjacentHTML('afterbegin', GP.demoBanner() + '<div class="code-rain" id="rain" aria-hidden="true"></div>' +
    '<main class="err-page" id="main"><div class="err-wrap">' +
    '<a class="err-logo" href="' + GP.PAGES.home + '" aria-label="Git Pizza MxDev home"><img src="' + GP.ASSETS + 'brand/logo-horizontal.svg" alt="Git Pizza MxDev logo" width="271" height="48"></a>' +
    '<div class="err-head"><img class="err-illus" src="' + GP.ASSETS + 'illustrations/error-crust-not-found.png" alt="" width="240" height="180"><div style="flex:1;min-width:260px">' +
      '<h1 style="margin:0"><span class="err-code"><span class="ms" aria-hidden="true">report</span>ERROR 404</span><span class="t-h1 err-title" style="display:block">CRUST_NOT_FOUND <span class="cursor amber" aria-hidden="true"></span></span><span class="sr-only"> — Page not found</span></h1>' +
      '<p class="t-body-long" style="margin:0">The page or record you asked for doesn\'t exist. It may have been archived, or the demo was reset.</p></div></div>' +
    '<section class="term" aria-label="Stack trace (decorative)"><div class="term-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>stack_trace.log</span></div>' +
      '<div class="term-body trace collapsed" id="trace">' + trace.map(function (l, i) { return '<div><span class="ln">' + (i + 1) + '</span>' + l + '</div>'; }).join('') +
      '<button class="btn btn-ghost btn-sm more" id="more" type="button">Show more</button></div></section>' +
    '<div class="t-small"><span class="cm">// SUGGESTED RESOLUTION:</span> Re-synchronize with the main branch.</div>' +
    '<div class="row err-actions"><a class="btn btn-primary" href="' + GP.PAGES.home + '" aria-label="Go to the home page"><span class="ms md" aria-hidden="true">terminal</span>RETURN_TO_MAIN</a>' +
      '<a class="btn btn-secondary" href="' + GP.trackHref() + '" aria-label="Track order"><span class="ms md" aria-hidden="true">route</span>./track.log</a></div>' +
    '<div class="t-micro c-muted" aria-hidden="true">LATENCY ' + (Math.round(performance.now() % 40) + 8) + ' ms · STATUS 404 · UPTIME ' + uptime() + '</div>' +
    '</div></main>');
  document.getElementById('more').onclick = function () { document.getElementById('trace').classList.remove('collapsed'); this.remove(); };
  var rain = document.getElementById('rain'), snippets = ['git checkout menu', 'oven.bake({ temp: 850 })', 'const dough = await ferment(48)', 'npm install toppings', 'git pull origin crust', 'while (hungry) { order(); }', 'SELECT * FROM pizzas', '404: CRUST_NOT_FOUND', 'git revert MX-1025'];
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(function () { var s = document.createElement('span'); s.textContent = snippets[Math.floor(Math.random() * snippets.length)]; s.style.left = Math.random() * 100 + '%';
      var d = 6 + Math.random() * 8; s.style.animationDuration = d + 's'; rain.appendChild(s); setTimeout(function () { s.remove(); }, d * 1000); }, 900);
  }
})();
</script>
